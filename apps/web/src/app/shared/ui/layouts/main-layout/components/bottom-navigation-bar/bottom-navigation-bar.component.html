<section class="flex flex-col h-[var(--txg-bottom-nav-height)] fixed bottom-0 left-0 right-0 z-100">
  <mat-divider class="!border-t-outline-variant"></mat-divider>
  <mat-toolbar class="flex-grow !p-0">
    <nav class="txg-content-measure relative">
      @for (link of navLinks; track link.label; let i = $index) {
        <div class="absolute top-1/2 -translate-x-1/2 -translate-y-1/2" [style.left]="(10 + i * 20) + '%'">
          <a mat-button class="h-full" routerLinkActive="active-nav-item" #linkActive="routerLinkActive" [routerLink]="link.disabled ? null : link.path" [attr.data-cy]="link.dataCy">
            <div class="flex flex-col items-center justify-center">
              <mat-icon [class]="navItemColorClass(link, linkActive.isActive)">{{ link.icon }}</mat-icon>
              <span [class]="navItemColorClass(link, linkActive.isActive)" class="text-xs mt-1 text-center">{{ link.label }}</span>
            </div>
          </a>
        </div>
      }
    </nav>
  </mat-toolbar>
</section>
