<h2 mat-dialog-title>Reorder training days</h2>

<mat-dialog-content>
  <p class="mb-3 text-sm text-on-surface-variant">Drag a day to change the order the plan cycles through them.</p>

  <ul
    class="m-0 p-0 list-none flex flex-col gap-2"
    cdkDropList
    [cdkDropListData]="days()"
    (cdkDropListDropped)="onDropped($event)"
    data-cy="reorder-days-list">
    @for (day of days(); track day.id) {
      <li class="reorder-item flex items-center gap-2 p-2 border border-outline-variant rounded-lg bg-surface cursor-grab" cdkDrag cdkDragLockAxis="y" data-cy="reorder-days-item">
        <span class="inline-flex text-outline" cdkDragHandle data-cy="reorder-days-handle">
          <mat-icon>drag_indicator</mat-icon>
        </span>
        <span class="flex-auto min-w-0 truncate">{{ day.name || 'Unnamed day' }}</span>
      </li>
    }
  </ul>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()" data-cy="reorder-days-cancel-button">Cancel</button>
  <button mat-flat-button (click)="onSave()" data-cy="reorder-days-save-button">Save order</button>
</mat-dialog-actions>
