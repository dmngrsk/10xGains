@if (exercises.length > 0) {
  <div cdkDropList [cdkDropListData]="exercises" [cdkDropListDisabled]="!capabilities.canReorder"
    (cdkDropListDropped)="onExerciseReordered($event)">
    @for (exercise of exercises; track exercise.id) {
      <txg-plan-exercise-item
        [planId]="planId"
        [dayId]="dayId"
        [exercise]="exercise"
        [progression]="getProgression(exercise.exerciseId)"
        [capabilities]="capabilities"
        (exerciseDeleted)="onExerciseDeleted($event)"
        (exerciseArchived)="onExerciseArchived($event)"
        (progressionEdited)="onProgressionEdited($event)"
        (setAdded)="onSetAdded($event)"
        (setEdited)="onSetEdited($event)"
        (setWeightStepped)="onSetWeightStepped($event)"
        data-cy="plan-exercise-item">
      </txg-plan-exercise-item>
    }
  </div>
} @else {
  <p class="text-sm text-secondary py-4">No exercises in this day yet.</p>
}

@if (capabilities.canAddItems) {
  <button
    mat-raised-button
    class="w-full"
    (click)="onExerciseAdded()"
    data-cy="plan-day-add-exercise-button">
    <mat-icon>add</mat-icon>
    <span>Add Exercise</span>
  </button>
}
