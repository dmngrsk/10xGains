@if (sessions.length === 0) {
  <txg-notice
    iconName="search_off"
    titleText="No Sessions Found"
    descriptionText="It looks like there are no sessions matching your current filters, or you haven't recorded any sessions yet."
    buttonText="Edit Filters"
    (buttonClicked)="onEditFiltersClicked()"
    data-cy="history-empty-notice">
  </txg-notice>
} @else {
  <div class="pb-18 w-full" data-cy="history-session-list">
    <txg-session-list
      [sessions]="sessions"
      [notesAccessible]="true"
      (sessionNavigated)="onSessionNavigated($event)"
      (notesClicked)="onNotesClicked($event)">
    </txg-session-list>

    @if (hasMore) {
      <!-- Sentinel for Intersection Observer -->
      <div #sentinel class="h-10" data-cy="history-load-more-sentinel"></div>
    }

    @if (isLoadingMore) {
      <div class="flex items-center mt-4 ml-2" data-cy="history-load-more-spinner">
        <mat-progress-spinner mode="indeterminate" diameter="30"></mat-progress-spinner>
        <span class="ml-4 text-secondary">Loading more sessions...</span>
      </div>
    }
  </div>
}
