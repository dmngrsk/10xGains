<txg-main-layout title="Settings" [loadingSignal]="isLoadingSignal">
  <txg-settings-tabs
    [viewMode]="viewMode()"
    (viewModeChanged)="onViewModeChanged($event)">
  </txg-settings-tabs>

  <div class="pt-[var(--txg-settings-content-offset)]">
    @if (viewMode() === 'workout') {
      <div class="p-4 grid grid-cols-1 gap-3" data-cy="settings-workout-view">
        <txg-session-settings-card>
        </txg-session-settings-card>

        <p class="flex items-center gap-2 px-2 text-sm text-on-surface-variant">
          <mat-icon class="!text-lg !w-auto !h-auto">info</mat-icon>
          These settings are saved on this device only.
        </p>
      </div>
    } @else if (viewModel(); as viewModel) {
      @if (viewModel.error) {
        <div class="txg-page-fill p-4">
          <txg-notice
            [descriptionText]="viewModel.error!"
            [isError]="true">
          </txg-notice>
        </div>
      } @else if (!viewModel.isLoading || initialLoadFinished()) {
        <div class="p-4 grid grid-cols-1 gap-6" data-cy="settings-user-view">
          <txg-profile-settings-card
            [profile]="viewModel.profile"
            (profileSaved)="onProfileSaved($event)">
          </txg-profile-settings-card>

          <txg-account-settings-card
            [account]="viewModel.account"
            (passwordChanged)="onPasswordChanged()"
            (signedOut)="onSignedOut()"
            (googleConnected)="onGoogleConnected()"
            (googleDisconnected)="onGoogleDisconnected()">
          </txg-account-settings-card>
        </div>
      }
    }
  </div>
</txg-main-layout>
