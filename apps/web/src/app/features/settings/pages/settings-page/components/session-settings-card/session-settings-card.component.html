<mat-card>
  <mat-card-header>
    <mat-card-title class="!font-medium !text-primary">Session</mat-card-title>
  </mat-card-header>
  <mat-card-content class="mt-7">
    <div class="flex items-center justify-between gap-4">
      <div class="flex flex-col">
        <span>Plate calculator</span>
        <span class="text-sm text-on-surface-variant">Show a barbell plate calculator during a session</span>
      </div>
      <mat-slide-toggle
        [checked]="plateCalculatorEnabled()"
        (change)="onPlateCalculatorToggled($event)"
        data-cy="settings-plate-calculator-toggle">
      </mat-slide-toggle>
    </div>

    <mat-divider class="!my-4"></mat-divider>

    <div class="flex items-center justify-between gap-4">
      <div class="flex flex-col">
        <span>Warmup sets</span>
        <span class="text-sm text-on-surface-variant">Suggest warmup sets before the first working set of an exercise</span>
      </div>
      <mat-slide-toggle
        [checked]="warmupSetsEnabled()"
        (change)="onWarmupSetsToggled($event)"
        data-cy="settings-warmup-sets-toggle">
      </mat-slide-toggle>
    </div>
  </mat-card-content>
</mat-card>
