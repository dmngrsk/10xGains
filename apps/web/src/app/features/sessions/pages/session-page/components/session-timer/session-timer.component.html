<div class="timer-container">
  <span class="px-4 timer-display" data-cy="session-timer">
    {{ timerText }}
  </span>
  <mat-divider [vertical]="true" class="mx-2"></mat-divider>
  <button mat-icon-button txgLongPress
    aria-label="Finish session"
    (txgClick)="onCompleteSession()"
    (txgLongPress)="onFinishOptionsRequested()"
    data-cy="complete-session-button">
    <mat-icon>check</mat-icon>
  </button>
</div>
