packages:
  - 'apps/*'
  - 'packages/*'
  - 'cypress'

# Postinstall build scripts are blocked by default since pnpm 10; the packages below
# are explicitly trusted (native binaries and CLI downloads required by the toolchain).
allowBuilds:
  '@parcel/watcher': true
  azure-functions-core-tools: true
  cypress: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  supabase: true
  unrs-resolver: true

# Security overrides for vulnerable transitive dependencies (pnpm audit).
overrides:
  '@babel/core@<7.29.1': ^7.29.1
  '@hono/node-server@<1.19.15': ^1.19.15
  'body-parser@<1.20.6': ^1.20.6
  'brace-expansion@<1.1.17': ^1.1.17
  'brace-expansion@>=2.0.0 <2.1.4': ^2.1.4
  'brace-expansion@>=5.0.0 <5.0.9': ^5.0.9
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  'fast-uri@<3.1.5': ^3.1.5
  'hono@<4.12.34': ^4.12.34
  http-proxy-middleware@>=3.0.0 <3.0.7: ^3.0.7
  'ip-address@<10.3.1': ^10.3.1
  'js-yaml@>=4.0.0 <4.3.1': ^4.3.1
  'nanoid@>=3.0.0 <3.3.18': ^3.3.18
  'postcss@<8.5.23': ^8.5.23
  tar@<7.5.21: ^7.5.21
  'undici@>=6.0.0 <6.28.0': ^6.28.0
  uuid@<11.1.1: ^11.1.1
  webpack-dev-server@<5.2.5: ^5.2.5
