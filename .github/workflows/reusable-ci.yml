name: Reusable Continuous Integration Workflow

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      build_name:
        type: string
      build_sha:
        type: string
      build_tag:
        type: string

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-latest
    steps:
      - name: Validate environment value
        if: inputs.environment != 'staging' && inputs.environment != 'production'
        run: |
          echo "Error: environment must be either 'staging' or 'production'"
          exit 1

      - name: Set git default branch
        run: |
          git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          pnpm install --frozen-lockfile

      - name: Run linter
        run: |
          pnpm lint

  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Set git default branch
        run: |
          git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          pnpm install --frozen-lockfile

      - name: Run unit tests with coverage
        run: |
          pnpm test:coverage

      - name: Upload unit test coverage
        if: inputs.environment == 'staging'
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: |
            apps/web/coverage/
            apps/api/coverage/
          retention-days: 7

  build-api:
    name: Build API app
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Set git default branch
        run: |
          git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          pnpm install --frozen-lockfile

      - name: Build API app deployment package
        run: |
          pnpm --filter @txg/api build:deploy

      - name: Upload build artifacts for staging
        if: inputs.environment == 'staging'
        uses: actions/upload-artifact@v7
        with:
          name: dist-api-staging
          path: apps/api/deploy/
          retention-days: 7

      - name: Upload build artifacts for production
        if: inputs.environment == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: dist-api-production
          path: apps/api/deploy/
          retention-days: 30

  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [lint, test]
    steps:
      - name: Set git default branch
        run: |
          git config --global init.defaultBranch main

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          standalone: true

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        env:
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          pnpm install --frozen-lockfile

      # Only build metadata is baked in. Everything describing the environment — the API and
      # Supabase addresses, the webmanifest name — is left as placeholders and applied by CD from
      # that run's Terraform outputs, so one artifact deploys to any environment.
      - name: Stamp build metadata
        run: |
          ENV_FILE="apps/web/src/environments/environment.ts"

          sed -i \
            -e "s|__BUILD_NAME__|${{ inputs.build_name }}|g" \
            -e "s|__BUILD_SHA__|${{ inputs.build_sha }}|g" \
            -e "s|__BUILD_TAG__|${{ inputs.build_tag }}|g" \
            "$ENV_FILE"

          if grep -qE '__BUILD_[A-Z]+__' "$ENV_FILE"; then
            echo "::error::Unsubstituted build placeholders remain in ${ENV_FILE}."
            exit 1
          fi
          cat "$ENV_FILE"

      # Unconditional by design. env.js is gitignored and written per machine for local
      # development; if a developer's copy ever reached a build it would ship localhost URLs, and
      # CD's placeholder guard could not catch it because there would be no placeholders left.
      - name: Write the runtime configuration template
        run: |
          cp -f apps/web/src/env.template.js apps/web/src/env.js
          cat apps/web/src/env.js

      - name: Build web app
        run: |
          pnpm build

      - name: Upload build artifacts for staging
        if: inputs.environment == 'staging'
        uses: actions/upload-artifact@v7
        with:
          name: dist-web-staging
          path: apps/web/dist/
          retention-days: 7

      - name: Upload build artifacts for production
        if: inputs.environment == 'production'
        uses: actions/upload-artifact@v7
        with:
          name: dist-web-production
          path: apps/web/dist/
          retention-days: 30
